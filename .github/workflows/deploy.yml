name: Validate and deploy Kujo MCP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest revision of a branch/PR needs validation and deployment.
concurrency:
  group: kujolang-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up patched Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned Access verifier bundle
        run: |
          npm ci --ignore-scripts
          npm run build:access
          npm run build:dashboard
          git diff --exit-code -- src/cloudflare/vendor/access-jose.js src/cloudflare/vendor/dashboard-bundle.js
      - name: Read reviewed build inputs
        id: inputs
        run: |
          node -e 'const x=require("./build-inputs.json"); for(const k of ["website_commit","framework_commit"]) if(!/^[a-f0-9]{40}$/.test(x[k])) throw Error(k); if(!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(x.kujo_version)) throw Error("runtime version");'
          echo "website=$(jq -r '.website_commit' build-inputs.json)" >> "$GITHUB_OUTPUT"
          echo "framework=$(jq -r '.framework_commit' build-inputs.json)" >> "$GITHUB_OUTPUT"
          echo "kujo=$(jq -r '.kujo_version' build-inputs.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: kujolang/mcp
          ref: ${{ steps.inputs.outputs.framework }}
          path: framework-mcp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: kujolang/kujolang.ai
          ref: ${{ steps.inputs.outputs.website }}
          path: kujolang.ai
      - name: Install exact Kujo runtime
        id: kujo
        uses: kujolang/kujo/.github/actions/setup-kujo@01d7df3add2375295dfedfc87b04ca848fee1106
        with:
          version: ${{ steps.inputs.outputs.kujo }}
      - name: Check catalog and native assertions
        env:
          KUJO_BIN: ${{ steps.kujo.outputs.kujo-path }}
        run: |
          kujo run scripts/sync_catalog.kujo --interpreter -- --site "$GITHUB_WORKSPACE/kujolang.ai" --check --json
          kujo run tests/run_all.kujo --interpreter
          kujo run server.kujo --interpreter --self-check
          node tests/native_http_test.mjs
          node tests/config_failures_test.mjs
      - name: Generate and verify Worker
        env:
          KUJO_BIN: ${{ steps.kujo.outputs.kujo-path }}
        run: |
          kujo run scripts/generate_worker.kujo --interpreter -- --framework "$GITHUB_WORKSPACE/framework-mcp" --catalog data/catalog.json --out dist/worker.js
          git diff --exit-code -- dist/worker.js dist/worker.js.sha256 dist/parity-fixtures.json dist/generation.json
          node --check dist/worker.js
          node tests/worker_contract_test.mjs
          node tests/analytics_test.mjs
          node tests/dashboard_test.mjs
          node tests/history_test.mjs
          node tests/clients_test.mjs
          python3 tests/analytics_storage_test.py
          node tests/hardening_http_test.mjs
          node tests/native_auth_test.mjs
          node benchmarks/worker_benchmark.mjs > worker-benchmark.json
          node benchmarks/selection_benchmark.mjs > selection-benchmark.json
          test "$(jq -r '.catalog_revision' dist/generation.json)" = "$(jq -r '.source.snapshot_sha256' data/catalog.json)"
          test "$(jq -r '.catalog_content_digest' dist/generation.json)" = "$(jq -r '.source.content_sha256' data/catalog.json)"
          ! grep -Eq '(/Users/|/home/|[A-Za-z]:\\\\)' dist/generation.json dist/parity-fixtures.json dist/worker.js
          test "$(wc -c < dist/worker.js)" -lt 2621440
      - name: Check optional CI deployment credentials
        id: deployment
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$DEPLOY_TOKEN" && -n "$DEPLOY_ACCOUNT" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Validation completed. CI deployment credentials are absent; a maintainer must deploy with the documented Wrangler login and verify the live catalog revision."
          fi
      - name: Deploy production Worker
        if: github.ref == 'refs/heads/main' && steps.deployment.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.151.3
          command: deploy

      - name: Verify deployed catalog
        if: github.ref == 'refs/heads/main' && steps.deployment.outputs.configured == 'true'
        run: node tests/production_catalog_test.mjs
